name: Tests and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      AUDIT_SECRET_KEY: ci-only-randomness-is-not-required-for-isolated-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Syntax check
        run: python -m compileall -q .
      - name: Test
        run: python -m pytest -q
      - name: Audit verification smoke test
        run: |
          python - <<'PY'
          from agents.base import AuditTrail
          audit = AuditTrail()
          entry = audit.log("CI", "test", "SMOKE_TEST", {"status": "OK"})
          assert audit.verify_integrity()
          audit.logs[0]["actor"] = "tampered"
          assert not audit.verify_integrity()
          PY
