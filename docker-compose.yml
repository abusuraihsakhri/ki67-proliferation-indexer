version: '3.8'

services:
  ki67-proliferation-indexer:
    build: .
    container_name: ki67-proliferation-indexer
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=ki67-proliferation-indexer-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
